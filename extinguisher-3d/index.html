*{box-sizing:border-box}

.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.08);pointer-events:auto;max-width:100%}

  +ib('head',m.head)+`<button class="ib" data-hold="1" aria-label="${m.press}" data-tip="${m.press}">${svg('press')}</button>`+(ex?ib('mech',m.mech,!!S.mech):'')+sep
  +ib('rotate',l.rotate,controls.autoRotate)+ib('zin',l.zoomIn)+ib('zout',l.zoomOut)+ib('reset',l.reset)+sep+ib('more','…',moreOpen);
 const menu=moreOpen?`<div class="menu">${[ex?['tour',l.tour,!!S.tour]:null,['label',lu.labelBtn,LV.open],['callouts',fu.labels,coOn],['mechReset',m.mechReset],['full',l.full],['png',l.png],['glb',l.glb]].filter(Boolean).map(([a,t,on])=>`<button data-act="${a}" class="${on?'on':''}">${svg(a)}<span>${t}</span></button>`).join('')}</div>`:'';
 $('#tools').innerHTML=`${S.xray&&S.mode!=='quiz'?`<div class="flownote">${l.simNote}</div>`:''}<div class="bar">${bar}</div>${menu}`;}
document.addEventListener('click',e=>{if(moreOpen&&!e.target.closest('.menu')&&!e.target.closest('[data-act=more]')){moreOpen=false;renderToolbar();}},true);
document.addEventListener('click',e=>{if(e.target.id==='lv'){closeLabel();return;}const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;
 switch(a){
 case 'lang':S.lang=v;SS('lang',v);if(window.speechSynthesis)speechSynthesis.cancel();LV.speaking=false;LV.msg='';refreshLabel();renderAll();renderLV();break;
 case 'theme':S.theme=v;SS('theme',v);renderAll();break;
 case 'type':if(GAL.on)galleryClose(v);else load(v);break;
 case 'mode':S.mode=v;stopTour(true);if(v!=='train'){S.sim={on:false,step:0,sq:false,msg:null,ok:true};S.pinOut=false;S.aim=false;S.sweep=false;}if(v!=='explore'){select(null);assembleAll();}renderAll();break;
 case 'part':if(S.tour)stopTour(true);if(INTERNAL.includes(v)&&!S.xray){S.xray=true;renderToolbar();}select(v);break;
 case 'explodeAll':explodeAll();break;
 case 'assembleAll':assembleAll();S.ghost=false;removeGhost();renderRight();break;
 case 'xray':S.xray=!S.xray;if(!S.xray)S.flow=false;applyOpacity();renderToolbar();break;
 case 'flow':flowPlay();break;
 case 'flowRestart':flowRestart();break;
 case 'rotate':controls.autoRotate=!controls.autoRotate;renderToolbar();break;
 case 'zin':zoom(.75);break;case 'zout':zoom(1.33);break;
 case 'reset':resetView();break;
 case 'tour':S.tour?stopTour():startTour();renderToolbar();break;
 case 'tourPrev':tourGo(S.tour.i-1);break;case 'tourNext':tourGo(S.tour.i+1);break;case 'tourStop':stopTour();renderToolbar();break;
 case 'full':document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{});break;
 case 'png':exportPNG();break;case 'glb':exportGLB();break;
 case 'ret':if(S.sel){MD.parts[S.sel].off.set(0,0,0);renderLeft();renderRight();}break;
 case 'ghost':S.ghost=!S.ghost;makeGhost();renderRight();break;
 case 'inspect':if(S.sel)focusPart(S.sel);break;
 case 'iso':S.iso=!S.iso;applyOpacity();if(S.iso)focusPart(S.sel);renderRight();break;
 case 'gallery':GAL.on?galleryClose():galleryOpen();break;
 case 'galPick':galleryClose(v);break;case 'galBack':galleryClose();break;
 case 'more':moreOpen=!moreOpen;renderToolbar();break;
 case 'compare':openCmp();break;case 'cmpClose':closeCmp();break;
 case 'callouts':coOn=!coOn;SS('callouts',coOn?'1':'0');coLast='';renderToolbar();break;
 case 'head':focusHead();break;
 case 'mech':S.mech?stopMech():startMech();break;
 case 'mechPrev':S.mech&&mechApply(Math.max(0,S.mech.i-1));break;case 'mechNext':S.mech&&mechApply(Math.min(7,S.mech.i+1));break;case 'mechStop':stopMech();break;
 case 'mechReset':mechReset();break;
 case 'label':openLabel();break;
 case 'lvTab':LV.tab=v;renderLV();break;
 case 'lvZoom':LV.zoom=Math.min(4,Math.max(1,LV.zoom+(+v)*.5));renderLV();break;
 case 'lvSpeak':lvSpeak();break;
 case 'lvFull':document.fullscreenElement?document.exitFullscreen():$('#lv').requestFullscreen?.().catch(()=>{});break;
 case 'lvClose':closeLabel();break;
 case 'cls':S.cls=v;renderLeft();break;
 case 'simStart':simStart();break;
 case 'simDo':simAct(['pull','aim','squeeze','sweep'][S.sim.step]);break;
 case 'qa':S.quiz.ans=+v;if(+v===QUIZ[S.quiz.i].a)S.quiz.score++;renderRight();break;
 case 'qnext':S.quiz.i++;S.quiz.ans=null;if(S.quiz.i>=QUIZ.length)S.quiz.done=true;renderRight();break;
 case 'qretry':S.quiz={i:0,score:0,ans:null,done:false};renderRight();break;}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#cmp').hidden){closeCmp();return;}if(e.key==='Escape'&&moreOpen){moreOpen=false;renderToolbar();return;}if(e.key==='Escape'&&LV.open){closeLabel();return;}if(e.key==='Escape'&&S.sel&&S.mode==='explore'){select(null);return;}if(e.key==='Escape'&&window.parent!==window)window.parent.postMessage({type:'fx3d:escape'},location.origin);});
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}

await Promise.race([Promise.all([document.fonts.load('700 40px "Noto Sans Arabic"'),document.fonts.load('700 40px "IBM Plex Sans"')]),new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
$('#loading').remove();
load(S.type);tick();
</script>
</body>
</html>
